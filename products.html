<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue - JUSTKHARIDO</title>
  <style>
    :root {
      --primary: #ff3e6c;
      --accent: #00f2fe;
      --bg-dark: #090d16;
      --card-bg: rgba(22, 27, 34, 0.8);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { background: var(--bg-dark); color: var(--text); padding-bottom: 60px; }

    /* Header */
    header {
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      margin-left: 24px;
      font-weight: 600;
      transition: 0.3s;
    }

    .nav-links a:hover { color: var(--primary); }

    /* Products Container */
    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; margin-top: 30px; }

    .product-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .product-img { width: 100%; height: 260px; object-fit: cover; }

    .details { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .price { font-size: 22px; font-weight: 900; color: var(--primary); margin-bottom: 15px; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .btn:hover:not(:disabled) { background: #e0325c; }
    .btn:disabled { background: #30363d; cursor: not-allowed; color: var(--text-muted); }

    .badge-out {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #da3633;
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <div class="logo">JUSTKHARIDO</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Store</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      <a href="order-history.html">Orders</a>
    </div>
  </header>

  <!-- Products Main Grid -->
  <div class="container">
    <h2 style="font-size: 28px; font-weight: 800;">Featured Collection</h2>
    <div id="product-grid" class="grid">
      <p style="color:var(--text-muted);">Syncing catalog from Firebase...</p>
    </div>
  </div>

  <script type="module">
    import { subscribeProducts } from './api.js';

    // Live Cart Badge Counter Update
    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      document.getElementById('cart-count').innerText = cart.length;
    }
    updateCartCount();

    // Fetch Products in Real-Time
    subscribeProducts((products) => {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';

      if (products.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted);">No items available right now.</p>';
        return;
      }

      products.forEach(p => {
        grid.innerHTML += `
          <div class="product-card">
            ${!p.isStock ? '<span class="badge-out">OUT OF STOCK</span>' : ''}
            <img src="${p.image || 'https://via.placeholder.com/300'}" alt="${p.title}" class="product-img">
            <div class="details">
              <div>
                <div class="title">${p.title}</div>
                <div class="price">₹${p.price}</div>
              </div>
              <button class="btn" ${!p.isStock ? 'disabled' : ''} onclick="addToCart('${p.id}', '${p.title}', ${p.price}, '${p.image}')">
                ${p.isStock ? 'ADD TO CART' : 'OUT OF STOCK'}
              </button>
            </div>
          </div>
        `;
      });
    });

    // Global Add to Cart Handler
    window.addToCart = (id, title, price, image) => {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart.push({ id, title, price, image });
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      alert(`${title} has been added to your cart!`);
    };
  </script>
</body>
</html>
