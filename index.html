<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to JustKharido</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      height: 100vh;
      background: linear-gradient(-45deg, #ff007f, #7f00ff, #00d4ff, #00ff88);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .landing-card {
      text-align: center;
      color: white;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }
    .title { font-size: 3.5rem; margin-bottom: 10px; text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 40px;
      font-size: 1.2rem;
      color: #fff;
      background: #ff007f;
      border: none;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.4s ease;
      box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
    }
    .btn:hover {
      background: #00d4ff;
      color: #000;
      transform: scale(1.1) rotate(2deg);
      box-shadow: 0 10px 25px rgba(0, 212, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="landing-card">
    <h1 class="title">JustKharido</h1>
    <p>Everything you love, just a click away!</p>
    <a href="home.html" class="btn">Shop Now &rarr;</a>
  </div>
</body>
</html>
