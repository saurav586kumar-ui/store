<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - JUSTKHARIDO</title>
  <style>
    :root {
      --primary: #ff3e6c;
      --accent: #00f2fe;
      --bg-dark: #090d16;
      --card-bg: rgba(22, 27, 34, 0.8);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { background: var(--bg-dark); color: var(--text); padding-bottom: 60px; }

    /* Header */
    header {
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links a { color: var(--text); text-decoration: none; margin-left: 24px; font-weight: 600; }
    .nav-links a:hover { color: var(--primary); }

    /* Cart Wrapper */
    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .cart-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; margin-top: 20px; }

    .cart-items { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 20px; }
    .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .cart-item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
    .item-info { flex-grow: 1; margin-left: 15px; }

    .checkout-card { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 24px; height: fit-content; }
    .input-field { width: 100%; padding: 12px; margin-bottom: 12px; background: #161b22; border: 1px solid var(--border); border-radius: 8px; color: var(--text); outline: none; }

    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: 800; cursor: pointer; margin-top: 10px; }
    .btn-remove { background: transparent; border: none; color: #da3633; cursor: pointer; font-weight: 700; }

    @media (max-width: 768px) { .cart-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header>
    <div class="logo">JUSTKHARIDO</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Store</a>
      <a href="cart.html">Cart</a>
      <a href="order-history.html">Orders</a>
    </div>
  </header>

  <div class="container">
    <h2 style="font-size: 28px; font-weight: 800;">Shopping Cart</h2>
    
    <div class="cart-grid">
      <!-- Items List -->
      <div class="cart-items" id="cart-list">
        <p style="color: var(--text-muted);">Your cart is empty.</p>
      </div>

      <!-- Checkout Form -->
      <div class="checkout-card">
        <h3 style="margin-bottom: 15px;">Order Details</h3>
        <input type="text" id="cust-name" placeholder="Full Name" class="input-field" required>
        <input type="tel" id="cust-phone" placeholder="Phone Number" class="input-field" required>
        <textarea id="cust-address" placeholder="Delivery Address" class="input-field" rows="3" required></textarea>

        <div style="display: flex; justify-content: space-between; margin: 20px 0; font-size: 18px; font-weight: 800;">
          <span>Total:</span>
          <span style="color: var(--primary);" id="cart-total">₹0</span>
        </div>

        <button class="btn" onclick="checkout()">PLACE ORDER</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { placeOrderInFirebase } from './api.js';

    let cart = JSON.parse(localStorage.getItem('cart') || '[]');

    function renderCart() {
      const container = document.getElementById('cart-list');
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">Your cart is empty.</p>';
        document.getElementById('cart-total').innerText = '₹0';
        return;
      }

      container.innerHTML = '';
      cart.forEach((item, index) => {
        total += item.price;
        container.innerHTML += `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.title}">
            <div class="item-info">
              <div style="font-weight: 700;">${item.title}</div>
              <div style="color: var(--primary); font-weight: 800;">₹${item.price}</div>
            </div>
            <button class="btn-remove" onclick="removeItem(${index})">Remove</button>
          </div>
        `;
      });

      document.getElementById('cart-total').innerText = `₹${total}`;
    }

    window.removeItem = (index) => {
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    };

    window.checkout = async () => {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();

      if (cart.length === 0) return alert('Your cart is empty!');
      if (!name || !phone || !address) return alert('Please fill in all details!');

      const totalAmount = cart.reduce((sum, item) => sum + item.price, 0);

      const orderData = {
        customerName: name,
        phone: phone,
        address: address,
        items: cart,
        totalAmount: totalAmount
      };

      try {
        const orderId = await placeOrderInFirebase(orderData);
        
        // Save order ID locally for order-history tracking
        const myOrders = JSON.parse(localStorage.getItem('my_orders') || '[]');
        myOrders.push(orderId);
        localStorage.setItem('my_orders', JSON.stringify(myOrders));

        localStorage.removeItem('cart');
        alert('Order placed successfully!');
        window.location.href = 'order-history.html';
      } catch (err) {
        alert('Failed to place order. Try again.');
      }
    };

    renderCart();
  </script>
</body>
</html>
