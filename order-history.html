<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Orders - JUSTKHARIDO</title>
  <style>
    :root {
      --primary: #ff3e6c;
      --accent: #00f2fe;
      --bg-dark: #090d16;
      --card-bg: rgba(22, 27, 34, 0.8);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { background: var(--bg-dark); color: var(--text); padding-bottom: 60px; }

    /* Header */
    header {
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links a { color: var(--text); text-decoration: none; margin-left: 24px; font-weight: 600; }
    .nav-links a:hover { color: var(--primary); }

    /* Container */
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .order-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 20px;
      margin-top: 20px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .status-tag {
      background: rgba(0, 242, 254, 0.15);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid var(--accent);
    }

    .item-row { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
    .item-row img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
  </style>
</head>
<body>

  <header>
    <div class="logo">JUSTKHARIDO</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Store</a>
      <a href="cart.html">Cart</a>
      <a href="order-history.html">Orders</a>
    </div>
  </header>

  <div class="container">
    <h2 style="font-size: 28px; font-weight: 800;">Order History</h2>
    <div id="orders-container">
      <p style="color: var(--text-muted); margin-top: 20px;">Fetching your orders...</p>
    </div>
  </div>

  <script type="module">
    import { subscribeOrders } from './api.js';

    const myOrderIds = JSON.parse(localStorage.getItem('my_orders') || '[]');
    const container = document.getElementById('orders-container');

    if (myOrderIds.length === 0) {
      container.innerHTML = '<p style="color: var(--text-muted); margin-top: 20px;">No recent orders found on this device.</p>';
    } else {
      subscribeOrders((allOrders) => {
        const myOrders = allOrders.filter(o => myOrderIds.includes(o.id));
        
        if (myOrders.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); margin-top: 20px;">No matching orders found.</p>';
          return;
        }

        container.innerHTML = '';
        myOrders.reverse().forEach(order => {
          let itemsHTML = '';
          order.items.forEach(i => {
            itemsHTML += `
              <div class="item-row">
                <img src="${i.image}" alt="${i.title}">
                <div>
                  <div style="font-weight: 700;">${i.title}</div>
                  <div style="color: var(--text-muted); font-size: 13px;">₹${i.price}</div>
                </div>
              </div>
            `;
          });

          container.innerHTML += `
            <div class="order-card">
              <div class="order-header">
                <div>
                  <span style="color: var(--text-muted); font-size: 13px;">Order ID: ${order.id}</span>
                  <div style="font-weight: 800; color: var(--primary);">Total: ₹${order.totalAmount}</div>
                </div>
                <span class="status-tag">${order.status || 'Processing'}</span>
              </div>
              <div>${itemsHTML}</div>
            </div>
          `;
        });
      });
    }
  </script>
</body>
</html>
