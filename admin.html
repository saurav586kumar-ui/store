<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustKharido - Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        .login-box {
            text-align: center;
            padding: 50px;
        }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #357ae8; }
        .order-card {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }
        .order-card p { margin: 5px 0; }
        .unauthorized {
            color: red;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        #admin-content { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>JustKharido Admin Dashboard</h2>

    <!-- Login Section -->
    <div id="login-section" class="login-box">
        <p>Please sign in with the authorized admin account to view orders.</p>
        <button id="login-btn">Sign in with Google</button>
    </div>

    <!-- Unauthorized Section -->
    <div id="unauthorized-section" style="display: none;">
        <p class="unauthorized">Access Denied! Only saurav586kumar@gmail.com is allowed to view this page.</p>
        <button id="logout-btn" style="background-color: #d9534f;">Sign Out</button>
    </div>

    <!-- Admin Panel Content (Orders List) -->
    <div id="admin-content">
        <h3>Live Orders</h3>
        <button id="signout-btn" style="background-color: #d9534f; float: right; margin-bottom: 15px;">Logout</button>
        <div style="clear: both;"></div>
        <div id="orders-container">Loading orders...</div>
    </div>
</div>

<!-- Firebase Scripts (Modular Version) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

    // Aapki exact Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBkSkf7-O3eR8LLAB9eqXqvScuYXkbqSAo",
        authDomain: "justkharido-c3d90.firebaseapp.com",
        databaseURL: "https://justkharido-c3d90-default-rtdb.firebaseio.com",
        projectId: "justkharido-c3d90",
        storageBucket: "justkharido-c3d90.firebasestorage.app",
        messagingSenderId: "307864405555",
        appId: "1:307864405555:web:11cfa26ad36eb4be054546",
        measurementId: "G-9JL04WQ6G2"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const allowedEmail = "saurav586kumar@gmail.com";

    const loginSection = document.getElementById('login-section');
    const unauthorizedSection = document.getElementById('unauthorized-section');
    const adminContent = document.getElementById('admin-content');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const signoutBtn = document.getElementById('signout-btn');
    const ordersContainer = document.getElementById('orders-container');

    // Google Login Trigger
    loginBtn.addEventListener('click', async () => {
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            console.error("Login Error:", error);
        }
    });

    // Logout Functionality
    const handleLogout = () => {
        signOut(auth).then(() => {
            window.location.reload();
        });
    };
    logoutBtn.addEventListener('click', handleLogout);
    signoutBtn.addEventListener('click', handleLogout);

    // Check Authentication State & Email
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            if (user.email === allowedEmail) {
                // Authorized User
                loginSection.style.display = 'none';
                unauthorizedSection.style.display = 'none';
                adminContent.style.display = 'block';
                fetchOrders();
            } else {
                // Logged in, but wrong email
                loginSection.style.display = 'none';
                adminContent.style.display = 'none';
                unauthorizedSection.style.display = 'block';
            }
        } else {
            // Not logged in
            loginSection.style.display = 'block';
            unauthorizedSection.style.display = 'none';
            adminContent.style.display = 'none';
        }
    });

    // Fetch Orders from Firestore
    async function fetchOrders() {
        try {
            const querySnapshot = await getDocs(collection(db, "orders"));
            ordersContainer.innerHTML = "";

            if (querySnapshot.empty) {
                ordersContainer.innerHTML = "<p>No orders found yet.</p>";
                return;
            }

            querySnapshot.forEach((doc) => {
                const order = doc.data();
                
                let itemsHtml = "";
                if(order.items && Array.isArray(order.items)) {
                    order.items.forEach(item => {
                        itemsHtml += `<li>${item.name} - Qty: ${item.qty} - ₹${item.price}</li>`;
                    });
                }

                const orderDiv = document.createElement('div');
                orderDiv.className = 'order-card';
                orderDiv.innerHTML = `
                    <p><strong>Order ID:</strong> ${doc.id}</p>
                    <p><strong>Customer Name:</strong> ${order.customerName || 'N/A'}</p>
                    <p><strong>Phone:</strong> ${order.customerPhone || 'N/A'}</p>
                    <p><strong>Address:</strong> ${order.address || 'N/A'}</p>
                    <p><strong>Date:</strong> ${order.date || order.createdAt || 'N/A'}</p>
                    <p><strong>Items:</strong></p>
                    <ul>${itemsHtml}</ul>
                `;
                ordersContainer.appendChild(orderDiv);
            });
        } catch (error) {
            console.error("Error fetching orders:", error);
            ordersContainer.innerHTML = "<p>Error loading orders.</p>";
        }
    }
</script>

</body>
</html>
