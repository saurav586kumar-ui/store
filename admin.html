<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Store Management</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }
    h1, h2 {
      color: #2c3e50;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    .form-row {
      display: flex;
      gap: 15px;
    }
    .form-row .form-group {
      flex: 1;
    }
    button {
      cursor: pointer;
      padding: 10px 18px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #3498db;
      color: white;
      width: 100%;
      font-size: 16px;
    }
    .btn-primary:hover {
      background: #2980b9;
    }
    .btn-danger {
      background: #e74c3c;
      color: white;
    }
    .btn-danger:hover {
      background: #c0392b;
    }
    .btn-stock {
      background: #2ecc71;
      color: white;
    }
    .btn-out {
      background: #e67e22;
      color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }
    th {
      background-color: #f8f9fa;
      color: #555;
    }
    .product-img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Admin Panel</h1>
    <button id="auth-btn" class="btn-danger" onclick="handleAuthAction()">Logout</button>
  </header>

  <!-- Add Product Form -->
  <div class="card">
    <h2>Add New Product</h2>
    <br>
    <div class="form-group">
      <label for="p-title">Product Title *</label>
      <input type="text" id="p-title" placeholder="e.g. Wireless Headphones">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="p-original-price">Original Price (₹)</label>
        <input type="number" id="p-original-price" placeholder="1999">
      </div>
      <div class="form-group">
        <label for="p-discount-price">Discounted/Selling Price (₹) *</label>
        <input type="number" id="p-discount-price" placeholder="999">
      </div>
    </div>

    <div class="form-group">
      <label for="p-extra">Extra Information / Description</label>
      <textarea id="p-extra" rows="2" placeholder="Product features or details..."></textarea>
    </div>

    <div class="form-group">
      <label for="p-files">Product Image(s) *</label>
      <input type="file" id="p-files" accept="image/*" multiple>
    </div>

    <button id="upload-btn" class="btn-primary" onclick="handleAddProduct()">UPLOAD PRODUCT</button>
  </div>

  <!-- Inventory List Table -->
  <div class="card">
    <h2>Product Inventory</h2>
    <table>
      <thead>
        <tr>
          <th>Image</th>
          <th>Title</th>
          <th>Price</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="inventory-list">
        <tr>
          <td colspan="5" style="text-align:center;">Loading products...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { 
    subscribeProducts, 
    addProductToFirebase, 
    deleteProductFromFirebase, 
    toggleStockStatus, 
    uploadImagesToCloudinary,
    listenAuthState,
    adminLogout
  } from './api.js';

  // Check Admin Login State
  listenAuthState((user) => {
    if (!user) {
      console.log("No admin logged in");
      // Optional: window.location.href = 'login.html';
    }
  });

  window.handleAuthAction = async () => {
    await adminLogout();
    alert("Logged out successfully");
  };

  // Render Live Inventory
  subscribeProducts((products) => {
    const tableBody = document.getElementById('inventory-list');
    if (!tableBody) return;

    if (!products || products.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No products in inventory</td></tr>`;
      return;
    }

    tableBody.innerHTML = products.map(p => `
      <tr>
        <td>
          <img src="${p.image || (p.images && p.images[0]) || 'https://via.placeholder.com/50'}" class="product-img" alt="Product" />
        </td>
        <td><strong>${p.title}</strong></td>
        <td>₹${p.discountPrice || p.price}</td>
        <td>
          <button class="${p.isStock ? 'btn-stock' : 'btn-out'}" onclick="handleToggleStock('${p.id}', ${p.isStock})">
            ${p.isStock ? 'In Stock' : 'Out of Stock'}
          </button>
        </td>
        <td>
          <button class="btn-danger" onclick="handleDeleteProduct('${p.id}')">Delete</button>
        </td>
      </tr>
    `).join('');
  });

  // Handle Add Product
  window.handleAddProduct = async () => {
    const title = document.getElementById('p-title').value.trim();
    const originalPrice = parseFloat(document.getElementById('p-original-price').value) || 0;
    const discountPrice = parseFloat(document.getElementById('p-discount-price').value) || 0;
    const extraInfo = document.getElementById('p-extra').value.trim();
    const fileInput = document.getElementById('p-files');
    const uploadBtn = document.getElementById('upload-btn');

    if (!title || !discountPrice || fileInput.files.length === 0) {
      return alert('Please fill Title, Price and select an Image file!');
    }

    try {
      uploadBtn.innerText = "Uploading Images...";
      uploadBtn.disabled = true;

      // Cloudinary Upload
      const imageUrls = await uploadImagesToCloudinary(fileInput.files);

      // Save to Firebase Firestore
      await addProductToFirebase({
        title,
        originalPrice: originalPrice || discountPrice,
        discountPrice,
        price: discountPrice,
        extraInfo,
        images: imageUrls,
        image: imageUrls[0],
        isStock: true,
        createdAt: new Date().toISOString()
      });

      alert('Product Added Successfully!');
      
      // Clear Form Fields
      document.getElementById('p-title').value = '';
      document.getElementById('p-original-price').value = '';
      document.getElementById('p-discount-price').value = '';
      document.getElementById('p-extra').value = '';
      fileInput.value = '';
    } catch (err) {
      alert("Error adding product: " + err.message);
    } finally {
      uploadBtn.innerText = "UPLOAD PRODUCT";
      uploadBtn.disabled = false;
    }
  };

  // Toggle Stock Action
  window.handleToggleStock = async (id, currentStatus) => {
    try {
      await toggleStockStatus(id, currentStatus);
    } catch (err) {
      alert("Error updating stock: " + err.message);
    }
  };

  // Delete Product Action
  window.handleDeleteProduct = async (id) => {
    if (confirm("Are you sure you want to delete this product?")) {
      try {
        await deleteProductFromFirebase(id);
      } catch (err) {
        alert("Error deleting product: " + err.message);
      }
    }
  };
</script>

</body>
</html>
