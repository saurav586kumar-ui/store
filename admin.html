<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - JUSTKHARIDO</title>
  <style>
    :root {
      --primary: #ff3e6c;
      --accent: #00f2fe;
      --bg-dark: #090d16;
      --card-bg: rgba(22, 27, 34, 0.85);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #da3633;
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { background: var(--bg-dark); color: var(--text); padding-bottom: 60px; }

    header {
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .card { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 24px; margin-bottom: 30px; }
    
    .input-field {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      outline: none;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-google {
      background: #4285F4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      font-size: 15px;
    }

    .btn-danger { background: var(--danger); }
    .btn-secondary { background: #30363d; }

    #login-box { max-width: 400px; margin: 100px auto; text-align: center; }
    #admin-dashboard { display: none; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-size: 14px; }
    .product-thumb { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }
  </style>
</head>
<body>

  <header>
    <div class="logo">JUSTKHARIDO ADMIN</div>
    <div id="auth-nav"></div>
  </header>

  <!-- Google Login Section -->
  <div id="login-box" class="card">
    <h2 style="margin-bottom: 10px;">Admin Panel Access</h2>
    <p style="color: var(--text-muted); margin-bottom: 25px;">Sign in with Google to manage products and orders.</p>
    <button class="btn btn-google" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M21.35 11.1H12v3.8h5.4c-.2 1.2-.9 2.2-2 2.9v2.4h3.2c1.9-1.7 3-4.3 3-7.3 0-.6-.1-1.2-.2-1.8z"/><path fill="#fff" d="M12 21c2.7 0 5-1 6.7-2.6l-3.2-2.4c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H3v2.5C4.7 18.5 8.1 21 12 21z"/><path fill="#fff" d="M6.2 12.7c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V6.2H3C2.3 7.6 2 9.2 2 11.2s.3 3.6 1 5l3.2-2.5z"/><path fill="#fff" d="M12 5.4c1.5 0 2.8.5 3.8 1.5l2.9-2.9C17 2.3 14.7 1.2 12 1.2 8.1 1.2 4.7 3.7 3 7.1l3.2 2.5c.8-2.5 3.1-4.2 5.8-4.2z"/></svg>
      Sign In with Google
    </button>
  </div>

  <!-- Dashboard Section -->
  <div id="admin-dashboard" class="container">
    
    <!-- Add Product Form -->
    <div class="card">
      <h3 style="margin-bottom: 15px;">Add New Product</h3>
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
        <input type="text" id="p-title" placeholder="Product Title" class="input-field">
        <input type="number" id="p-price" placeholder="Price (₹)" class="input-field">
      </div>
      <input type="url" id="p-image" placeholder="Image URL (Direct image link)" class="input-field">
      <button class="btn" onclick="handleAddProduct()">UPLOAD PRODUCT</button>
    </div>

    <!-- Inventory List -->
    <div class="card">
      <h3>Manage Inventory</h3>
      <table>
        <thead>
          <tr>
            <th>Image</th>
            <th>Title</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventory-list">
          <tr><td colspan="5" style="color:var(--text-muted);">Loading products...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Live Customer Orders -->
    <div class="card">
      <h3>Live Customer Orders</h3>
      <div id="orders-list" style="margin-top: 15px;">
        <p style="color: var(--text-muted);">Loading orders...</p>
      </div>
    </div>

  </div>

  <script type="module">
    import { 
      adminLoginWithGoogle, 
      adminLogout, 
      listenAuthState, 
      subscribeProducts, 
      addProductToFirebase, 
      toggleStockStatus, 
      deleteProductFromFirebase, 
      subscribeOrders 
    } from './api.js';

    // Auth State Check
    listenAuthState((user) => {
      const loginBox = document.getElementById('login-box');
      const dashboard = document.getElementById('admin-dashboard');
      const authNav = document.getElementById('auth-nav');

      if (user) {
        loginBox.style.display = 'none';
        dashboard.style.display = 'block';
        authNav.innerHTML = `<button class="btn btn-secondary" onclick="handleLogout()">LOGOUT (${user.displayName || 'Admin'})</button>`;
        initAdminData();
      } else {
        loginBox.style.display = 'block';
        dashboard.style.display = 'none';
        authNav.innerHTML = '';
      }
    });

    window.handleGoogleLogin = async () => {
      try {
        await adminLoginWithGoogle();
      } catch (err) {
        alert("Google Login Failed: " + err.message);
      }
    };

    window.handleLogout = () => adminLogout();

    function initAdminData() {
      subscribeProducts((products) => {
        const tbody = document.getElementById('inventory-list');
        tbody.innerHTML = '';
        products.forEach(p => {
          tbody.innerHTML += `
            <tr>
              <td><img src="${p.image}" class="product-thumb"></td>
              <td style="font-weight:700;">${p.title}</td>
              <td>₹${p.price}</td>
              <td>
                <button class="btn ${p.isStock ? 'btn' : 'btn-secondary'}" onclick="toggleStock('${p.id}', ${p.isStock})">
                  ${p.isStock ? 'IN STOCK' : 'OUT OF STOCK'}
                </button>
              </td>
              <td>
                <button class="btn btn-danger" onclick="removeProduct('${p.id}')">Delete</button>
              </td>
            </tr>
          `;
        });
      });

      subscribeOrders((orders) => {
        const container = document.getElementById('orders-list');
        if(orders.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted);">No orders received yet.</p>';
          return;
        }
        container.innerHTML = '';
        orders.reverse().forEach(o => {
          container.innerHTML += `
            <div style="background:#161b22; padding:15px; border-radius:10px; margin-bottom:12px; border:1px solid var(--border);">
              <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <strong>Order #${o.id}</strong>
                <span style="color:var(--primary); font-weight:800;">₹${o.totalAmount}</span>
              </div>
              <div style="font-size:14px; color:var(--text-muted); margin-bottom:8px;">
                <strong>Customer:</strong> ${o.customerName} (${o.phone})<br>
                <strong>Address:</strong> ${o.address}
              </div>
            </div>
          `;
        });
      });
    }

    window.handleAddProduct = async () => {
      const title = document.getElementById('p-title').value.trim();
      const price = parseFloat(document.getElementById('p-price').value);
      const image = document.getElementById('p-image').value.trim();

      if (!title || !price || !image) return alert('Please fill all product fields!');

      await addProductToFirebase({ title, price, image, isStock: true });

      document.getElementById('p-title').value = '';
      document.getElementById('p-price').value = '';
      document.getElementById('p-image').value = '';
      alert('Product Added Successfully!');
    };

    window.toggleStock = (id, current) => toggleStockStatus(id, current);
    window.removeProduct = (id) => {
      if(confirm('Are you sure you want to delete this product?')) {
        deleteProductFromFirebase(id);
      }
    };
  </script>
</body>
</html>
