<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Store Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    /* Loading Spinner */
    #auth-loading {
      text-align: center;
      padding: 50px;
      font-size: 18px;
      font-weight: bold;
      color: #666;
    }

    /* Login Overlay Screen */
    #login-screen {
      display: none; /* Initially Hidden */
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .google-btn {
      background: #4285F4;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .google-btn:hover { background: #357ae8; }

    /* Admin Dashboard */
    #dashboard-screen {
      display: none; /* Initially Hidden */
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; padding: 15px 25px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px;
    }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }
    
    button { cursor: pointer; padding: 10px 18px; border: none; border-radius: 5px; font-weight: bold; }
    .btn-primary { background: #3498db; color: white; width: 100%; font-size: 16px; }
    .btn-primary:hover { background: #2980b9; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-stock { background: #2ecc71; color: white; }
    .btn-out { background: #e67e22; color: white; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
    th { background-color: #f8f9fa; color: #555; }
    .product-img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
  </style>
</head>
<body>

<div class="container">

  <!-- AUTH LOADING INDICATOR -->
  <div id="auth-loading">Checking Authentication Status...</div>

  <!-- LOGIN SECTION (Only visible if logged out) -->
  <div id="login-screen">
    <h2>Admin Login</h2>
    <p style="margin-top: 10px; color: #666;">Sign in with Google to access dashboard</p>
    <button class="google-btn" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#fff" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#fff" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#fff" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#fff" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
  </div>

  <!-- ADMIN DASHBOARD (Only visible if logged in) -->
  <div id="dashboard-screen">
    <header>
      <h1>Admin Panel</h1>
      <div>
        <span id="user-email" style="margin-right: 15px; font-weight: bold; color: #555;"></span>
        <button class="btn-danger" onclick="handleLogout()">Logout</button>
      </div>
    </header>

    <!-- Add Product Form -->
    <div class="card">
      <h2>Add New Product</h2>
      <br>
      <div class="form-group">
        <label for="p-title">Product Title *</label>
        <input type="text" id="p-title" placeholder="e.g. Wireless Headphones">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="p-original-price">Original Price (₹)</label>
          <input type="number" id="p-original-price" placeholder="1999">
        </div>
        <div class="form-group">
          <label for="p-discount-price">Discounted Price (₹) *</label>
          <input type="number" id="p-discount-price" placeholder="999">
        </div>
      </div>

      <div class="form-group">
        <label for="p-extra">Description</label>
        <textarea id="p-extra" rows="2" placeholder="Product details..."></textarea>
      </div>

      <div class="form-group">
        <label for="p-files">Product Image(s) *</label>
        <input type="file" id="p-files" accept="image/*" multiple>
      </div>

      <button id="upload-btn" class="btn-primary" onclick="handleAddProduct()">UPLOAD PRODUCT</button>
    </div>

    <!-- Inventory Table -->
    <div class="card">
      <h2>Product Inventory</h2>
      <table>
        <thead>
          <tr>
            <th>Image</th>
            <th>Title</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventory-list">
          <tr><td colspan="5" style="text-align:center;">Loading products...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script type="module">
  import { 
    subscribeProducts, 
    addProductToFirebase, 
    deleteProductFromFirebase, 
    toggleStockStatus, 
    uploadImagesToCloudinary,
    listenAuthState,
    adminLoginWithGoogle,
    adminLogout
  } from './api.js';

  const authLoading = document.getElementById('auth-loading');
  const loginScreen = document.getElementById('login-screen');
  const dashboardScreen = document.getElementById('dashboard-screen');
  const userEmailSpan = document.getElementById('user-email');

  let unsubscribeLiveSync = null;

  // Strict Authentication Listener
  listenAuthState((user) => {
    // Hide initial loading status
    authLoading.style.display = 'none';

    if (user) {
      // User is authenticated
      loginScreen.style.display = 'none';
      dashboardScreen.style.display = 'block';
      userEmailSpan.innerText = user.email || 'Admin';
      
      // Start listening to products only when authenticated
      if (!unsubscribeLiveSync) {
        unsubscribeLiveSync = loadInventory();
      }
    } else {
      // User is NOT authenticated
      dashboardScreen.style.display = 'none';
      loginScreen.style.display = 'block';
      userEmailSpan.innerText = '';
      
      if (unsubscribeLiveSync) {
        unsubscribeLiveSync();
        unsubscribeLiveSync = null;
      }
    }
  });

  // Google Login Trigger
  window.handleGoogleLogin = async () => {
    try {
      await adminLoginWithGoogle();
    } catch (err) {
      alert("Login Failed: " + err.message);
    }
  };

  // Logout Trigger
  window.handleLogout = async () => {
    await adminLogout();
  };

  // Live Inventory Sync
  function loadInventory() {
    return subscribeProducts((products) => {
      const tableBody = document.getElementById('inventory-list');
      if (!tableBody) return;

      if (!products || products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No products in inventory</td></tr>`;
        return;
      }

      tableBody.innerHTML = products.map(p => `
        <tr>
          <td>
            <img src="${p.image || (p.images && p.images[0]) || 'https://via.placeholder.com/50'}" class="product-img" alt="Product" />
          </td>
          <td><strong>${p.title}</strong></td>
          <td>₹${p.discountPrice || p.price}</td>
          <td>
            <button class="${p.isStock ? 'btn-stock' : 'btn-out'}" onclick="handleToggleStock('${p.id}', ${p.isStock})">
              ${p.isStock ? 'In Stock' : 'Out of Stock'}
            </button>
          </td>
          <td>
            <button class="btn-danger" onclick="handleDeleteProduct('${p.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    });
  }

  // Handle Add Product
  window.handleAddProduct = async () => {
    const title = document.getElementById('p-title').value.trim();
    const originalPrice = parseFloat(document.getElementById('p-original-price').value) || 0;
    const discountPrice = parseFloat(document.getElementById('p-discount-price').value) || 0;
    const extraInfo = document.getElementById('p-extra').value.trim();
    const fileInput = document.getElementById('p-files');
    const uploadBtn = document.getElementById('upload-btn');

    if (!title || !discountPrice || fileInput.files.length === 0) {
      return alert('Please fill Title, Price and select Image!');
    }

    try {
      uploadBtn.innerText = "Uploading Images to Cloudinary...";
      uploadBtn.disabled = true;

      // Cloudinary Direct Upload
      const imageUrls = await uploadImagesToCloudinary(fileInput.files);

      uploadBtn.innerText = "Saving to Firebase...";

      // Firestore Add
      await addProductToFirebase({
        title,
        originalPrice: originalPrice || discountPrice,
        discountPrice,
        price: discountPrice,
        extraInfo,
        images: imageUrls,
        image: imageUrls[0],
        isStock: true,
        createdAt: new Date().toISOString()
      });

      alert('Product Added Successfully!');
      
      document.getElementById('p-title').value = '';
      document.getElementById('p-original-price').value = '';
      document.getElementById('p-discount-price').value = '';
      document.getElementById('p-extra').value = '';
      fileInput.value = '';
    } catch (err) {
      alert("Error adding product: " + err.message);
    } finally {
      uploadBtn.innerText = "UPLOAD PRODUCT";
      uploadBtn.disabled = false;
    }
  };

  // Toggle Stock Status
  window.handleToggleStock = async (id, currentStatus) => {
    try {
      await toggleStockStatus(id, currentStatus);
    } catch (err) {
      alert("Error: " + err.message);
    }
  };

  // Delete Product
  window.handleDeleteProduct = async (id) => {
    if (confirm("Delete this product?")) {
      try {
        await deleteProductFromFirebase(id);
      } catch (err) {
        alert("Error: " + err.message);
      }
    }
  };
</script>

</body>
</html>
