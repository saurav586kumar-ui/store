<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - JUSTKHARIDO</title>
  <style>
    :root {
      --primary: #ff3e6c;
      --accent: #00f2fe;
      --bg-dark: #090d16;
      --card-bg: rgba(22, 27, 34, 0.85);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #da3633;
      --success: #238636;
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { background: var(--bg-dark); color: var(--text); padding-bottom: 60px; }

    /* Header */
    header {
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .card { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 24px; margin-bottom: 30px; }
    
    .input-field {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      outline: none;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover { opacity: 0.9; }
    .btn-danger { background: var(--danger); }
    .btn-secondary { background: #30363d; }

    /* Auth Overlay */
    #login-box { max-width: 400px; margin: 100px auto; }
    #admin-dashboard { display: none; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-size: 14px; }
    .product-thumb { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }
  </style>
</head>
<body>

  <header>
    <div class="logo">JUSTKHARIDO ADMIN</div>
    <div id="auth-nav"></div>
  </header>

  <!-- Login Section -->
  <div id="login-box" class="card">
    <h2 style="margin-bottom: 20px; text-align: center;">Admin Login</h2>
    <input type="email" id="login-email" placeholder="Admin Email" class="input-field">
    <input type="password" id="login-pass" placeholder="Password" class="input-field">
    <button class="btn" style="width: 100%;" onclick="handleLogin()">LOGIN</button>
  </div>

  <!-- Dashboard Section -->
  <div id="admin-dashboard" class="container">
    
    <!-- Add Product Form -->
    <div class="card">
      <h3 style="margin-bottom: 15px;">Add New Product</h3>
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
        <input type="text" id="p-title" placeholder="Product Title" class="input-field">
        <input type="number" id="p-price" placeholder="Price (₹)" class="input-field">
      </div>
      <input type="url" id="p-image" placeholder="Image URL (Unsplash or direct link)" class="input-field">
      <button class="btn" onclick="handleAddProduct()">UPLOAD PRODUCT</button>
    </div>

    <!-- Inventory List -->
    <div class="card">
      <h3>Manage Inventory</h3>
      <table>
        <thead>
          <tr>
            <th>Image</th>
            <th>Title</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventory-list">
          <tr><td colspan="5" style="color:var(--text-muted);">Loading products...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Customer Orders -->
    <div class="card">
      <h3>Live Customer Orders</h3>
      <div id="orders-list" style="margin-top: 15px;">
        <p style="color: var(--text-muted);">Loading orders...</p>
      </div>
    </div>

  </div>

  <script type="module">
    import { 
      adminLogin, 
      adminLogout, 
      listenAuthState, 
      subscribeProducts, 
      addProductToFirebase, 
      toggleStockStatus, 
      deleteProductFromFirebase, 
      subscribeOrders 
    } from './api.js';

    // Authentication Guard
    listenAuthState((user) => {
      const loginBox = document.getElementById('login-box');
      const dashboard = document.getElementById('admin-dashboard');
      const authNav = document.getElementById('auth-nav');

      if (user) {
        loginBox.style.display = 'none';
        dashboard.style.display = 'block';
        authNav.innerHTML = `<button class="btn btn-secondary" onclick="handleLogout()">LOGOUT</button>`;
        initAdminData();
      } else {
        loginBox.style.display = 'block';
        dashboard.style.display = 'none';
        authNav.innerHTML = '';
      }
    });

    window.handleLogin = async () => {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      try {
        await adminLogin(email, pass);
      } catch (err) {
        alert('Invalid Admin Credentials!');
      }
    };

    window.handleLogout = () => adminLogout();

    function initAdminData() {
      // Stream Products
      subscribeProducts((products) => {
        const tbody = document.getElementById('inventory-list');
        tbody.innerHTML = '';
        products.forEach(p => {
          tbody.innerHTML += `
            <tr>
              <td><img src="${p.image}" class="product-thumb"></td>
              <td style="font-weight:700;">${p.title}</td>
              <td>₹${p.price}</td>
              <td>
                <button class="btn ${p.isStock ? 'btn' : 'btn-secondary'}" onclick="toggleStock('${p.id}', ${p.isStock})">
                  ${p.isStock ? 'IN STOCK' : 'OUT OF STOCK'}
                </button>
              </td>
              <td>
                <button class="btn btn-danger" onclick="removeProduct('${p.id}')">Delete</button>
              </td>
            </tr>
          `;
        });
      });

      // Stream Orders
      subscribeOrders((orders) => {
        const container = document.getElementById('orders-list');
        if(orders.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted);">No orders received yet.</p>';
          return;
        }
        container.innerHTML = '';
        orders.reverse().forEach(o => {
          container.innerHTML += `
            <div style="background:#161b22; padding:15px; border-radius:10px; margin-bottom:12px; border:1px solid var(--border);">
              <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <strong>Order #${o.id}</strong>
                <span style="color:var(--primary); font-weight:800;">₹${o.totalAmount}</span>
              </div>
              <div style="font-size:14px; color:var(--text-muted); margin-bottom:8px;">
                <strong>Customer:</strong> ${o.customerName} (${o.phone})<br>
                <strong>Address:</strong> ${o.address}
              </div>
            </div>
          `;
        });
      });
    }

    window.handleAddProduct = async () => {
      const title = document.getElementById('p-title').value.trim();
      const price = parseFloat(document.getElementById('p-price').value);
      const image = document.getElementById('p-image').value.trim();

      if (!title || !price || !image) return alert('Please fill all product fields!');

      await addProductToFirebase({
        title,
        price,
        image,
        isStock: true
      });

      document.getElementById('p-title').value = '';
      document.getElementById('p-price').value = '';
      document.getElementById('p-image').value = '';
      alert('Product Added Successfully!');
    };

    window.toggleStock = (id, current) => toggleStockStatus(id, current);
    window.removeProduct = (id) => {
      if(confirm('Are you sure you want to delete this product?')) {
        deleteProductFromFirebase(id);
      }
    };
  </script>
</body>
</html>
